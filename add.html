<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8">
    <meta name="viewport" content="width=device-width, initial-scale=1.0">
    <title>お客様情報登録 | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-blue: #87ceeb; --sidebar-bg: #1a1a1a; --copros-orange: #ff7e11; --copros-navy: #004098; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        .form-input {
            width: 100%; padding: 0.8rem 1rem; background-color: #f8fafc;
            border: 1px solid #e2e8f0; border-radius: 0.75rem; font-weight: 600;
            transition: all 0.2s; font-size: 0.95rem;
        }
        .form-input:focus {
            outline: none; border-color: var(--copros-orange);
            background-color: white; box-shadow: 0 0 0 4px rgba(255, 126, 17, 0.1);
        }
        .label-text { font-size: 0.85rem; font-weight: 800; color: #334155; margin-bottom: 0.5rem; display: block; }
        .section-title {
            font-size: 0.75rem; font-weight: 900; color: #94a3b8; letter-spacing: 0.1em;
            border-bottom: 2px solid #f1f5f9; padding-bottom: 0.5rem; margin-bottom: 1.5rem; text-transform: uppercase;
        }
        .form-card { background: white; border-radius: 2rem; border: 1px solid #e2e8f0; box-shadow: 0 20px 25px -5px rgba(0, 0, 0, 0.05); }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">

    <div id="sidebar-placeholder"></div>

    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>

        <div class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-4xl mx-auto">
                
                <!-- ヘッドエリア：他画面とデザイン統合 -->
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-8 gap-4">
                    <div>
                        <h1 id="pageTitle" class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-1">お客様情報登録</h1>
                        <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic">Create New Customer Identity</nav>
                    </div>
                    <div class="flex gap-2 w-full lg:w-auto">
                        <button onclick="location.href='list.html'" class="flex-1 lg:flex-none px-6 py-2.5 bg-white border border-slate-200 text-slate-500 rounded-xl font-bold text-xs hover:bg-slate-50 transition-all">
                            <i class="fa-solid fa-arrow-left mr-2"></i>戻る
                        </button>
                        <button id="saveBtnTop" class="flex-1 lg:flex-none px-10 py-2.5 bg-[#004098] text-white rounded-xl font-bold text-sm hover:shadow-lg transition-all active:scale-95">
                            <i class="fa-solid fa-cloud-arrow-up mr-2"></i>登録を実行
                        </button>
                    </div>
                </div>

                <div class="form-card p-6 lg:p-10 mb-20">
                    <form id="customerForm" class="space-y-10">
                        
                        <!-- 区分設定 -->
                        <div>
                            <p class="section-title">区分設定</p>
                            <div class="flex flex-wrap gap-6 bg-slate-50 p-6 rounded-2xl border border-slate-100">
                                <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="category" value="法人" checked class="w-5 h-5 accent-[#ff7e11]"><span class="font-bold">法人</span></label>
                                <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="category" value="個人" class="w-5 h-5 accent-[#ff7e11]"><span class="font-bold">個人</span></label>
                                <label class="flex items-center gap-3 cursor-pointer"><input type="radio" name="category" value="日報" class="w-5 h-5 accent-[#ff7e11]"><span class="font-bold">日報</span></label>
                            </div>
                        </div>

                        <!-- 基本情報 -->
                        <div>
                            <p class="section-title">基本情報</p>
                            <div class="grid grid-cols-1 md:grid-cols-2 gap-8">
                                <div>
                                    <label class="label-text">お客様名 <span class="text-rose-500">*</span></label>
                                    <input type="text" id="name" placeholder="例：株式会社コプロス" class="form-input" required>
                                </div>
                                <div>
                                    <label class="label-text">お客様名カナ <span class="text-rose-500">*</span></label>
                                    <input type="text" id="kana" placeholder="例：コプロス" class="form-input" required>
                                    <p class="text-[10px] text-orange-500 mt-2 font-black leading-relaxed">※50音検索用。カタカナで「株式会社」等は除いて入力。</p>
                                </div>
                                <div>
                                    <label class="label-text">顧客ランク</label>
                                    <select id="rank" class="form-input font-bold">
                                        <option value="">選択無し</option>
                                        <option>Aa</option><option>Ab</option><option>Ac</option><option>Ad</option>
                                        <option>Ba</option><option>Bb</option><option>Bc</option><option>Bd</option>
                                        <option>Ca</option><option>Cb</option><option>Cc</option><option>Cd</option>
                                        <option>取引先</option><option>合併</option><option>廃業</option>
                                    </select>
                                </div>
                                <div>
                                    <label class="label-text">属性・区分</label>
                                    <select id="type" class="form-input font-bold">
                                        <option value="">カテゴリ未設定</option>
                                        <option>ケコム</option>
                                        <option>コンサル</option>
                                        <option>官庁</option>
                                        <option>取引先</option>
                                    </select>
                                </div>
                            </div>
                        </div>

                        <!-- 所在地情報 -->
                        <div>
                            <p class="section-title">所在地情報</p>
                            <div class="w-full">
                                <label class="label-text">住所 <span class="text-rose-500">*</span></label>
                                <input type="text" id="address" placeholder="例：山口県下関市長府安養寺1-15-13" class="form-input" required>
                                <p class="text-[10px] text-slate-400 mt-2 font-bold">※ビル名や部屋番号まで正確に入力してください。</p>
                            </div>
                        </div>

                        <!-- 連絡先 -->
                        <div>
                            <p class="section-title">連絡先</p>
                            <div class="w-full md:w-1/2">
                                <label class="label-text">電話番号 <span class="text-rose-500">*</span></label>
                                <input type="tel" id="tel" placeholder="例：0832460545" class="form-input" required>
                            </div>
                        </div>

                        <!-- ボタン -->
                        <div class="pt-12 border-t border-slate-100 flex flex-col md:flex-row items-center justify-center gap-4">
                           <button type="button" id="saveBtnBottom" class="w-full max-w-xs py-4 bg-[#004098] text-white rounded-xl font-black text-sm hover:shadow-lg transition-all active:scale-95 flex items-center justify-center gap-3">
                               <i class="fa-solid fa-cloud-arrow-up"></i> 保存を実行
                         </button>
                         <!-- 編集時のみJSで表示制御する削除ボタン -->
                         <button type="button" id="deleteBtn" class="hidden w-full max-w-[150px] py-4 bg-rose-50 text-rose-500 border border-rose-100 rounded-xl font-black text-sm hover:bg-rose-500 hover:text-white transition-all active:scale-95">
                             <i class="fa-solid fa-trash-can mr-2"></i> 削除
                         </button>
                         </div>

                    </form>
                </div>
            </div>
        </div>
    </main>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db } from "./common.js";
        import { collection, addDoc, serverTimestamp, doc, getDoc, updateDoc, deleteDoc } 
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        const editId = sessionStorage.getItem('cp_edit_customer_id');

        // 🌟 編集モードの初期化
        async function checkEditMode() {
            if (!editId) return;

            // タイトルとボタンの文言を変更
            document.getElementById('pageTitle').innerText = "お客様情報 編集";
            document.getElementById('saveBtnTop').innerHTML = '<i class="fa-solid fa-check mr-2"></i>更新を保存';
            document.getElementById('saveBtnBottom').innerHTML = '<i class="fa-solid fa-check mr-2"></i>更新を保存';
            document.getElementById('deleteBtn').classList.remove('hidden');

            // 既存データの読み込み
            try {
                const snap = await getDoc(doc(db, "customers", editId));
                if (snap.exists()) {
                    const d = snap.data();
                    if (d.category) document.querySelector(`input[name="category"][value="${d.category}"]`).checked = true;
                    document.getElementById('name').value = d.name || "";
                    document.getElementById('kana').value = d.kana || "";
                    document.getElementById('rank').value = d.rank || "";
                    document.getElementById('type').value = d.type || "";
                    document.getElementById('address').value = d.address || "";
                    document.getElementById('tel').value = d.tel || "";
                }
            } catch (e) { console.error("Load Error:", e); }
        }

        const handleSave = async () => {
            const form = document.getElementById('customerForm');
            if (!form.checkValidity()) { form.reportValidity(); return; }

            const btns = [document.getElementById('saveBtnTop'), document.getElementById('saveBtnBottom'), document.getElementById('deleteBtn')];
            btns.forEach(b => b.disabled = true);

            const data = {
                category: document.querySelector('input[name="category"]:checked').value,
                name: document.getElementById('name').value.trim(),
                kana: document.getElementById('kana').value.trim(),
                rank: document.getElementById('rank').value,
                type: document.getElementById('type').value,
                address: document.getElementById('address').value.trim(),
                tel: document.getElementById('tel').value.trim(),
                updatedAt: serverTimestamp()
            };

            try {
                if (editId) {
                    await updateDoc(doc(db, "customers", editId), data);
                    alert("情報を更新しました");
                } else {
                    await addDoc(collection(db, "customers"), { 
                        ...data, 
                        visitCount: 0, lastVisit: "未訪問", createdAt: serverTimestamp() 
                    });
                    alert("新しいお客様を登録しました！");
                }
                sessionStorage.removeItem('cp_edit_customer_id'); // 終わったらID消去
                location.href = 'list.html';
            } catch (e) {
                alert("保存エラー: " + e.message);
                btns.forEach(b => b.disabled = false);
            }
        };

        // 🌟 削除処理
        document.getElementById('deleteBtn').onclick = async () => {
            if (!confirm("このお客様情報を完全に削除しますか？")) return;
            try {
                await deleteDoc(doc(db, "customers", editId));
                alert("削除しました");
                sessionStorage.removeItem('cp_edit_customer_id');
                location.href = 'list.html';
            } catch (e) { alert("削除エラー: " + e.message); }
        };

        document.getElementById('saveBtnTop').onclick = handleSave;
        document.getElementById('saveBtnBottom').onclick = handleSave;
        checkEditMode();
    </script>
</body>
</html>
