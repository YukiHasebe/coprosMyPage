<!DOCTYPE html>
<html lang="ja">
<head>
    <meta charset="UTF-8"><title>訪問実績履歴 | CP My Page</title>
    <script src="https://cdn.tailwindcss.com"></script>
    <link rel="stylesheet" href="https://cdnjs.cloudflare.com/ajax/libs/font-awesome/6.0.0/css/all.min.css">
    <style>
        :root { --copros-blue: #004098; --copros-orange: #ff7e11; }
        body { font-family: "Hiragino Kaku Gothic ProN", Meiryo, sans-serif; background-color: #f1f5f9; }
        .history-card { background: white; border-radius: 1.2rem; border: 1px solid #e2e8f0; transition: all 0.3s; overflow: hidden; margin-bottom: 1rem; box-shadow: 0 4px 6px -1px rgba(0,0,0,0.03); }
        .history-header { padding: 1.2rem 2rem; cursor: pointer; display: flex; justify-content: space-between; align-items: center; background: #3c4b5a; color: white; transition: background 0.2s; }
        .history-header:hover { background: #2d3748; }
        .history-body { display: none; padding: 2rem; background: white; border-top: 1px solid #f1f5f9; }
        .detail-label { font-size: 0.7rem; font-weight: 900; color: #94a3b8; width: 120px; flex-shrink: 0; text-transform: uppercase; }
        .detail-content { font-size: 0.9rem; font-weight: 700; color: #334155; line-height: 1.6; }
        .detail-row { display: flex; align-items: center; padding: 0.7rem 0; border-bottom: 1px solid #f8fafc; }
        .detail-row:last-child { border-bottom: none; }
        .custom-scrollbar::-webkit-scrollbar { width: 6px; }
        .custom-scrollbar::-webkit-scrollbar-thumb { background: #cbd5e1; border-radius: 10px; }
        .attach-grid { display: flex; flex-wrap: wrap; gap: 0.75rem; margin-top: 0.75rem; }
        .attach-item { position: relative; cursor: pointer; border-radius: 0.75rem; overflow: hidden; border: 2px solid #e2e8f0; transition: all 0.2s; flex-shrink: 0; }
        .attach-item:hover { border-color: var(--copros-orange); transform: scale(1.03); box-shadow: 0 8px 20px rgba(255,126,17,0.2); }
        .attach-item img { width: 90px; height: 90px; object-fit: cover; display: block; }
        .attach-zoom-icon { position: absolute; inset: 0; background: rgba(0,0,0,0); display: flex; align-items: center; justify-content: center; transition: background 0.2s; }
        .attach-item:hover .attach-zoom-icon { background: rgba(0,0,0,0.35); }
        .attach-zoom-icon i { color: white; font-size: 1.2rem; opacity: 0; transition: opacity 0.2s; }
        .attach-item:hover .attach-zoom-icon i { opacity: 1; }
        .lightbox { display: none; position: fixed; inset: 0; background: rgba(0,0,0,0.93); z-index: 9999; align-items: center; justify-content: center; backdrop-filter: blur(8px); }
        .lightbox.active { display: flex; }
        .lightbox-img-wrap { position: relative; max-width: 94vw; max-height: 94vh; }
        .lightbox-img-wrap img { max-width: 94vw; max-height: 88vh; border-radius: 1rem; object-fit: contain; box-shadow: 0 30px 80px rgba(0,0,0,0.7); }
        .lightbox-close { position: absolute; top: -2.5rem; right: 0; color: white; font-size: 1.8rem; cursor: pointer; opacity: 0.7; transition: opacity 0.2s; line-height: 1; }
        .lightbox-close:hover { opacity: 1; }
        .lightbox-filename { text-align: center; color: rgba(255,255,255,0.5); font-size: 0.75rem; font-weight: 700; margin-top: 0.75rem; }
        .lightbox-nav { position: absolute; top: 50%; transform: translateY(-50%); color: white; font-size: 1.8rem; cursor: pointer; opacity: 0.5; transition: opacity 0.2s; padding: 0.5rem; user-select: none; }
        .lightbox-nav:hover { opacity: 1; }
        .lightbox-nav.prev { left: -3.5rem; }
        .lightbox-nav.next { right: -3.5rem; }
        .lightbox-counter { text-align: center; color: rgba(255,255,255,0.4); font-size: 0.7rem; font-weight: 900; margin-top: 0.4rem; }
    </style>
</head>
<body class="flex h-screen overflow-hidden text-slate-700">
    <div id="sidebar-placeholder"></div>
    <main class="flex-1 flex flex-col overflow-hidden">
        <div id="header-placeholder"></div>
        <div class="flex-1 overflow-y-auto p-4 lg:p-8 custom-scrollbar">
            <div class="max-w-[1100px] mx-auto">
                <div class="flex flex-col lg:flex-row justify-between items-start lg:items-end mb-10 gap-4">
                    <div>
                        <h1 class="text-3xl lg:text-4xl font-black text-slate-800 tracking-tighter mb-1">訪問実績履歴</h1>
                        <nav class="text-[10px] font-black text-slate-400 uppercase tracking-widest italic mb-4">Customer Interaction Archive</nav>
                        <p id="targetCustomerName" class="text-2xl font-black text-[#004098] border-l-4 border-orange-500 pl-4">読み込み中...</p>
                        <div id="customerMetaBadges" class="flex gap-2 mt-2 pl-4 hidden">
                            <span id="badgeRank" class="bg-[#004098] text-white px-3 py-1 rounded-full text-[10px] font-black"></span>
                            <span id="badgeAttr" class="bg-orange-100 text-orange-600 px-3 py-1 rounded-full text-[10px] font-black border border-orange-200"></span>
                        </div>
                    </div>
                    <div class="flex gap-3 w-full lg:w-auto">
                        <button onclick="window.goBack()" class="flex-1 lg:flex-none px-6 py-2.5 bg-white border border-slate-200 text-slate-500 rounded-xl font-bold text-xs hover:bg-slate-50 shadow-sm transition-all">戻る</button>
                        <button id="newRegBtn" class="flex-1 lg:flex-none px-8 py-2.5 bg-[#ff7e11] text-white rounded-xl font-black text-xs hover:shadow-lg transition-all flex items-center justify-center gap-2 active:scale-95">
                            <i class="fa-solid fa-plus"></i> このお客様の実績を書く
                        </button>
                    </div>
                </div>
                <div id="historyListContainer" class="space-y-4 pb-24">
                    <div class="py-20 text-center text-slate-300 font-bold italic animate-pulse uppercase">Syncing Activity History...</div>
                </div>
            </div>
        </div>
    </main>

    <!-- ライトボックス -->
    <div id="lightbox" class="lightbox" onclick="window.handleLightboxClick(event)">
        <div class="lightbox-img-wrap">
            <div class="lightbox-close" onclick="window.closeLightbox(); event.stopPropagation();">
                <i class="fa-solid fa-xmark"></i>
            </div>
            <div class="lightbox-nav prev" id="lbPrev" onclick="window.lbNavigate(-1); event.stopPropagation();">
                <i class="fa-solid fa-chevron-left"></i>
            </div>
            <div class="lightbox-nav next" id="lbNext" onclick="window.lbNavigate(1); event.stopPropagation();">
                <i class="fa-solid fa-chevron-right"></i>
            </div>
            <img id="lightboxImg" src="" alt="拡大表示">
            <div class="lightbox-filename" id="lightboxFilename"></div>
            <div class="lightbox-counter" id="lightboxCounter"></div>
        </div>
    </div>

    <script type="module" src="common.js"></script>
    <script type="module">
        import { db } from "./common.js";
        import { collection, getDocs, query, where, limit }
            from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

        // =========================================================
        // URLパラメータ
        // =========================================================
        const params   = new URLSearchParams(window.location.search);
        const rawName  = params.get('name') ? decodeURIComponent(params.get('name')) : '';
        const customerRank = params.get('rank') ? decodeURIComponent(params.get('rank')) : '';
        const customerAttr = params.get('attr') ? decodeURIComponent(params.get('attr')) : '';

        const customerName = rawName;
        const clean = (s) => (s || "").toString().replace(/[\s\u3000]+/g, '').trim();
        const cleanName = clean(rawName);
        const fmtDate = (s) => s ? String(s).replace(/-/g, '/') : '--/--/--';

        // =========================================================
        // ライトボックス
        // =========================================================
        let lbImages = [], lbCurrent = 0;

        window.openLightbox = (images, startIdx) => {
            lbImages  = images;
            lbCurrent = startIdx || 0;
            renderLightbox();
            document.getElementById('lightbox').classList.add('active');
            document.addEventListener('keydown', handleLbKey);
        };
        window.closeLightbox = () => {
            document.getElementById('lightbox').classList.remove('active');
            document.getElementById('lightboxImg').src = '';
            document.removeEventListener('keydown', handleLbKey);
        };
        window.lbNavigate = (dir) => {
            lbCurrent = (lbCurrent + dir + lbImages.length) % lbImages.length;
            renderLightbox();
        };
        window.handleLightboxClick = (e) => {
            if (e.target === document.getElementById('lightbox')) window.closeLightbox();
        };
        function renderLightbox() {
            document.getElementById('lightboxImg').src            = lbImages[lbCurrent].src;
            document.getElementById('lightboxFilename').innerText = lbImages[lbCurrent].name || '';
            document.getElementById('lightboxCounter').innerText  = lbImages.length > 1 ? `${lbCurrent + 1} / ${lbImages.length}` : '';
            document.getElementById('lbPrev').style.display = lbImages.length > 1 ? 'block' : 'none';
            document.getElementById('lbNext').style.display = lbImages.length > 1 ? 'block' : 'none';
        }
        function handleLbKey(e) {
            if (e.key === 'ArrowLeft')  window.lbNavigate(-1);
            if (e.key === 'ArrowRight') window.lbNavigate(1);
            if (e.key === 'Escape')     window.closeLightbox();
        }

        // =========================================================
        // レコードごとの画像リスト
        // =========================================================
        let recordImageMap = {};
        window.openLightboxFromRecord = (recordIdx, imgIdx) => {
            const images = recordImageMap[recordIdx] || [];
            if (images.length) window.openLightbox(images, imgIdx);
        };

        // =========================================================
        // 戻る処理（省エネ＋既読同期）
        // =========================================================
        window.goBack = () => {
            // ▼ カレンダーキャッシュをクリア
            Object.keys(sessionStorage).forEach(k => {
                if (k.startsWith('cp_cal_cache')) sessionStorage.removeItem(k);
            });
            
            history.back();
        };

        // =========================================================
        // init
        // =========================================================
        async function init() {
            if (!rawName) {
                document.getElementById('historyListContainer').innerHTML =
                    '<p class="p-20 text-center text-slate-400">お客様名が正しく取得できませんでした。</p>';
                return;
            }

            document.getElementById('targetCustomerName').innerText = customerName;
                        // --- 修正箇所：爆速キャッシュチェック ---
            const CACHE_KEY = `cp_history_cache_v2_${cleanName}`;
            const cached = sessionStorage.getItem(CACHE_KEY);
            if (cached) {
                const records = JSON.parse(cached);
                renderHistory(records);
                autoOpenFirst();
                return; 
            }

            if (customerRank || customerAttr) {
                document.getElementById('customerMetaBadges').classList.remove('hidden');
                if (customerRank) document.getElementById('badgeRank').innerText = `ランク：${customerRank}`;
                if (customerAttr) document.getElementById('badgeAttr').innerText  = customerAttr;
            }

            document.getElementById('newRegBtn').onclick = () => {
                const p = new URLSearchParams({ name: customerName, rank: customerRank, attr: customerAttr });
                location.href = `history.html?${p.toString()}`;
            };

            try {
                let records = [];

                // ① 完全一致検索
                const snap1 = await getDocs(query(
                    collection(db, "activity_records"),
                    where("customerName", "==", rawName),
                    limit(50)
                ));
                records = snap1.docs.map(d => ({ id: d.id, ...d.data() }));

                // ② cleanした名前で再検索
                if (records.length === 0 && cleanName !== rawName) {
                    const snap2 = await getDocs(query(
                        collection(db, "activity_records"),
                        where("customerName", "==", cleanName),
                        limit(50)
                    ));
                    records = snap2.docs.map(d => ({ id: d.id, ...d.data() }));
                }

                // ③ 全件取得してJS側でclean比較
                if (records.length === 0) {
                    const snap3 = await getDocs(query(
                        collection(db, "activity_records"),
                        limit(500)
                    ));
                    records = snap3.docs
                        .map(d => ({ id: d.id, ...d.data() }))
                        .filter(r => clean(r.customerName) === cleanName);
                }

                // 日付降順ソート
                records.sort((a, b) => {
                    const da  = (a.visitDate || '').replace(/\//g, '-');
                    const db_ = (b.visitDate || '').replace(/\//g, '-');
                    return da > db_ ? -1 : da < db_ ? 1 : 0;
                });

                if (!records.length) {
                    document.getElementById('historyListContainer').innerHTML =
                        `<div class="py-20 text-center border-2 border-dashed border-slate-200 rounded-3xl">
                            <p class="text-slate-300 font-black italic tracking-widest uppercase">No Activity Found for this Customer</p>
                            <p class="text-slate-300 text-xs mt-2">${customerName}</p>
                        </div>`;
                    return;
                }

                renderHistory(records);
                // --- 修正箇所：取得したデータを保存 ---
                sessionStorage.setItem(CACHE_KEY, JSON.stringify(records));
                autoOpenFirst();

            } catch (e) {
                console.error("履歴取得エラー:", e);
                document.getElementById('historyListContainer').innerHTML = `
                    <div class="py-16 text-center border-2 border-dashed border-rose-200 rounded-3xl bg-rose-50 px-8">
                        <i class="fa-solid fa-triangle-exclamation text-rose-400 text-3xl mb-4 block"></i>
                        <p class="text-rose-500 font-black text-sm mb-2">データの読み込みに失敗しました</p>
                        <p class="text-rose-300 font-bold text-xs mb-1">${e.message}</p>
                        <p class="text-rose-300 font-bold text-[10px]">コード: ${e.code || '不明'}</p>
                        <button onclick="init()" class="mt-6 px-8 py-2 bg-[#004098] text-white rounded-xl font-black text-xs hover:opacity-90">
                            再読み込み
                        </button>
                    </div>`;
            }
        }

        // --- 修正箇所：特定の日付の実績を自動で「全開」にする ---
function autoOpenFirst() {
    const params = new URLSearchParams(window.location.search);
    const targetDate = params.get('targetDate'); // カレンダー/一覧から渡される日付
    const focusDate = params.get('focusDate');   // カレンダーの数字クリック用
    const dateToFind = targetDate || (focusDate ? focusDate.replace(/-/g, '/') : null);
    
    const cards = document.querySelectorAll('.history-card');
    let found = false;

    cards.forEach(card => {
        const dateText = card.querySelector('.history-header span').innerText.trim();
        const body = card.querySelector('.history-body');
        const arrow = card.querySelector('.arrow-icon');

        // 指定の日付と一致する場合、または指定がなく1件目の場合、アコーディオンを開く
        if ((dateToFind && dateText.includes(dateToFind)) || (!dateToFind && !found)) {
            body.style.display = 'block';
            arrow.style.transform = 'rotate(180deg)';
            if (dateToFind && !found) {
                card.scrollIntoView({ behavior: 'smooth', block: 'start' });
            }
            found = true;
        } else {
            body.style.display = 'none';
            arrow.style.transform = 'rotate(0deg)';
        }
    });
}

        // =========================================================
        // 添付画像レンダリング
        // =========================================================
        function renderAttachments(attachments, recordIdx) {
            if (!attachments || !attachments.length) return '';
            const images = attachments
                .filter(f => {
                    const src = f.base64 || f.url || '';
                    return src && (
                        (f.type || '').startsWith('image/') ||
                        src.startsWith('data:image') ||
                        /\.(jpg|jpeg|png|gif|webp)$/i.test(src)
                    );
                })
                .map(f => ({ src: f.base64 || f.url, name: f.name || '添付画像' }));
            if (!images.length) return '';
            recordImageMap[recordIdx] = images;
            const thumbs = images.map((img, imgIdx) => `
                <div class="attach-item"
                     onclick="window.openLightboxFromRecord(${recordIdx}, ${imgIdx})"
                     title="${img.name}">
                    <img src="${img.src}" alt="${img.name}" loading="lazy">
                    <div class="attach-zoom-icon">
                        <i class="fa-solid fa-magnifying-glass-plus"></i>
                    </div>
                </div>`).join('');
            return `
                <div class="mt-6 p-4 bg-slate-50 rounded-2xl border border-slate-200">
                    <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">
                        <i class="fa-solid fa-images mr-1 text-orange-400"></i>
                        添付画像（${images.length}枚）・クリックで拡大
                    </p>
                    <div class="attach-grid">${thumbs}</div>
                </div>`;
        }

        // =========================================================
        // renderHistory
        // =========================================================
        function renderHistory(dataList) {
            recordImageMap = {};
            const container = document.getElementById('historyListContainer');
            container.innerHTML = dataList.map((data, recordIdx) => {
                const attachments = data.attachments || [];
                const images = attachments
                    .filter(f => {
                        const src = f.base64 || f.url || '';
                        return src && (
                            (f.type || '').startsWith('image/') ||
                            src.startsWith('data:image') ||
                            /\.(jpg|jpeg|png|gif|webp)$/i.test(src)
                        );
                    })
                    .map(f => ({ src: f.base64 || f.url, name: f.name || '添付画像' }));
                recordImageMap[recordIdx] = images;

                return `
                <div class="history-card">
                    <div class="history-header" onclick="window.toggleDetail(this)">
                        <div class="flex items-center gap-4 flex-wrap">
                            <span class="text-sm font-black tracking-widest bg-white/10 px-4 py-1 rounded-full">
                                ${fmtDate(data.visitDate)}
                            </span>
                            <span class="text-sm font-black opacity-90">${data.visitorName || '担当者不明'}</span>
                            ${images.length > 0
                                ? `<span class="bg-orange-400/20 text-orange-200 px-2 py-0.5 rounded-full text-[10px] font-black">
                                       <i class="fa-solid fa-image mr-1"></i>${images.length}枚
                                   </span>`
                                : ''}
                        </div>
                        <i class="fa-solid fa-chevron-down transition-transform duration-300 arrow-icon opacity-40 text-xs ml-4 flex-shrink-0"></i>
                    </div>
                    <div class="history-body">
                        <div class="grid grid-cols-1 lg:grid-cols-2 gap-x-16 border-b border-slate-50 mb-6">
                            <div class="detail-row">
                                <div class="detail-label">お客様担当者</div>
                                <div class="detail-content">${data.customerStaffName || '--'}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">訪問時間</div>
                                <div class="detail-content text-blue-600">
                                    <i class="fa-regular fa-clock mr-1"></i>
                                    ${data.startTime || '00:00'} 〜 ${data.endTime || '00:00'}
                                </div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">同行者</div>
                                <div class="detail-content">${data.companion || 'なし'}</div>
                            </div>
                            <div class="detail-row">
                                <div class="detail-label">所属部署</div>
                                <div class="detail-content text-slate-400 text-xs uppercase">${data.visitorDept || '不明'}</div>
                            </div>
                        </div>
                        <div class="mb-6">
                            <p class="detail-label mb-3">定性データ分析</p>
                            <div class="flex flex-wrap gap-2">
                                ${data.qualData1 ? `<span class="bg-blue-50 text-[#004098] px-3 py-1 rounded-lg text-[10px] font-black border border-blue-100">${data.qualData1}</span>` : ''}
                                ${data.qualData2 ? `<span class="bg-orange-50 text-orange-600 px-3 py-1 rounded-lg text-[10px] font-black border border-orange-100">${data.qualData2}</span>` : ''}
                                ${data.qualData3 ? `<span class="bg-emerald-50 text-emerald-600 px-3 py-1 rounded-lg text-[10px] font-black border border-emerald-100">${data.qualData3}</span>` : ''}
                                ${data.qualFree ? `<span class="bg-slate-100 text-slate-600 px-3 py-1 rounded-lg text-[10px] font-black border border-slate-200">${data.qualFree}</span>` : ''}
                                ${!data.qualData1 && !data.qualData2 && !data.qualData3 && !data.qualFree
                                    ? '<span class="text-slate-300 text-xs font-bold italic">（未分類）</span>' : ''}
                            </div>
                        </div>
                        <div class="space-y-6">
                            <div class="p-6 bg-slate-50 rounded-2xl border border-slate-100">
                                <p class="text-[9px] font-black text-slate-400 uppercase tracking-widest mb-3">■ お客様からの情報（要望・状況）</p>
                                <div class="detail-content whitespace-pre-wrap text-slate-700">${data.content || '-'}</div>
                            </div>
                            <div class="p-6 bg-orange-50/30 rounded-2xl border border-orange-100/50">
                                <p class="text-[9px] font-black text-orange-400 uppercase tracking-widest mb-3">■ 自分・スタッフの考え（次回提案・課題）</p>
                                <div class="detail-content whitespace-pre-wrap text-slate-600">${data.staffThoughts || '-'}</div>
                            </div>
                        </div>

                        <div class="mt-6 p-6 bg-slate-50 rounded-2xl border-2 border-blue-100/50 shadow-inner">
                            <p class="text-[10px] font-black text-blue-500 uppercase tracking-widest mb-4 flex items-center gap-2">
                                <i class="fa-solid fa-comment-dots text-sm"></i> 指導・確認コメント
                            </p>
                            <div class="space-y-3 mb-5">
                                ${(data.comments || []).map(c => `
                                    <div class="p-3 bg-white rounded-xl border border-blue-50 shadow-sm text-left">
                                        <div class="flex justify-between items-center mb-1">
                                            <span class="text-[10px] font-black px-2 py-0.5 bg-blue-50 text-blue-600 rounded-full">${c.sender} ➔ ${c.receiver}</span>
                                            <span class="text-[9px] font-bold text-slate-400 font-mono">${c.date}</span>
                                        </div>
                                        <p class="text-xs font-bold text-slate-700 leading-relaxed">${c.text}</p>
                                    </div>
                                `).join('')}
                            </div>
                            <div class="space-y-3 text-left">
                                <textarea id="cmt-text-${data.id}" class="w-full p-3 text-xs font-bold border border-slate-200 rounded-xl focus:ring-2 focus:ring-blue-400 outline-none min-h-[80px]" placeholder="コメントを入力..."></textarea>
                                <div class="flex flex-col sm:flex-row justify-between items-center gap-4">
                                    <div class="flex items-center gap-2 w-full sm:flex-1">
                                        <span class="text-[10px] font-black text-slate-400 whitespace-nowrap">宛先:</span>
                                        <select id="cmt-to-${data.id}" class="w-full text-[10px] font-bold p-2 rounded-lg border border-slate-200 bg-white">
                                            <option value="${data.visitorName}">${data.visitorName}（担当者）</option>
                                            <option value="全員">関係者全員</option>
                                        </select>
                                    </div>
                                    <button onclick="window.postComment('${data.id}', '${data.customerName}')" class="w-full sm:w-auto px-6 py-2 bg-[#004098] text-white rounded-xl text-[10px] font-black hover:shadow-lg active:scale-95 transition-all">
                                        送信
                                    </button>
                                </div>
                            </div>
                        </div>                      
                        ${renderAttachments(data.attachments, recordIdx)}
                        <div class="mt-8 flex justify-end">
                            <div class="bg-[#004098] text-white px-5 py-2 rounded-xl text-xs font-black shadow-md">
                                <i class="fa-regular fa-calendar-check mr-2"></i>
                                次回訪問予定日：${fmtDate(data.nextVisitDate)}
                            </div>
                        </div>
                    </div>
                </div>`;
            }).join('');
        }
// --- 修正箇所：コメント投稿と通知送信のロジック ---
import { arrayUnion, updateDoc, addDoc, serverTimestamp } from "https://www.gstatic.com/firebasejs/10.8.0/firebase-firestore.js";

window.postComment = async (recordId, customerName) => {
    const text = document.getElementById(`cmt-text-${recordId}`).value.trim();
    const receiver = document.getElementById(`cmt-to-${recordId}`).value;
    const sender = sessionStorage.getItem('userName') || "管理者";
    if (!text) return alert("コメントを入力してください");

    try {
        const ref = doc(db, "activity_records", recordId);
        const now = new Date();
        const dateStr = `${now.getMonth()+1}/${now.getDate()} ${now.getHours()}:${String(now.getMinutes()).padStart(2,'0')}`;
        
        // 1. 実績レコードにコメントを追加
        await updateDoc(ref, { comments: arrayUnion({ sender, receiver, text, date: dateStr }) });

        // 2. 通知を作成（相手の画面に「入電」と出すため）
        await addDoc(collection(db, "notifications"), {
            recipient: receiver === "全員" ? "ALL" : receiver,
            visitorName: sender,
            customerName: customerName,
            type: "コメント入電",
            isRead: false,
            createdAt: serverTimestamp()
        });

        alert("コメントを送信しました");
        // キャッシュを破棄して画面を更新
        sessionStorage.removeItem(`cp_history_cache_${clean(customerName)}`);
        location.reload();
    } catch (e) {
        alert("送信エラー: " + e.message);
    }
};
        window.toggleDetail = (el) => {
            const body   = el.nextElementSibling;
            const arrow  = el.querySelector('.arrow-icon');
            const isOpen = body.style.display === 'block';
            body.style.display    = isOpen ? 'none' : 'block';
            arrow.style.transform = isOpen ? 'rotate(0deg)' : 'rotate(180deg)';
        };

        init();
    </script>
